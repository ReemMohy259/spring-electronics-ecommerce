spring.application.name=electronics-ecommerce
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:1.5b}
spring.ai.ollama.chat.temperature=0.1
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.num-ctx=4096
spring.ai.ollama.chat.num-predict=500
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=200ms
spring.ai.retry.backoff.max-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVICE_URI:http://localhost:8081/realms/electronics}