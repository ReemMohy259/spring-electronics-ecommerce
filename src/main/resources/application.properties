spring.application.name=electronics-ecommerce
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:1.5b}
spring.ai.ollama.chat.temperature=0.1
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.num-ctx=4096
spring.ai.ollama.chat.num-predict=500
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=200ms
spring.ai.retry.backoff.max-interval=1s
spring.ai.retry.backoff.multiplier=2